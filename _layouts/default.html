<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Treasured</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      /* Brand: Carmine #a10b2b, Pistachio #bcd382, Leaf #66ab56 — same tokens as the app. */
      --bg: #fff8f7; --surface: #fcf1f0; --text: #1f1a1a; --muted: #524343;
      --primary: #a10b2b; --accent-bg: #bcd382; --accent-text: #2e3e00; --line: #d7c1c1;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171212; --surface: #1f1a1a; --text: #ebe0df; --muted: #d7c1c1;
              --primary: #ffb3b4; --accent-bg: #445613; --accent-text: #e2f2b4; --line: #524343; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header, main, footer { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding-top: 20px; }
    header a.brand { color: var(--primary); font-weight: 700; font-size: 20px; text-decoration: none; }
    nav a { color: var(--muted); margin-left: 16px; text-decoration: none; font-size: 15px; }
    nav a:hover { color: var(--primary); }
    main { padding-top: 24px; padding-bottom: 48px; }
    h1 { font-size: 34px; line-height: 1.2; margin: 8px 0 4px; }
    h2 { font-size: 21px; margin-top: 36px; color: var(--primary); }
    a { color: var(--primary); }
    em:first-of-type { color: var(--muted); }
    ul { padding-left: 22px; }
    li { margin: 6px 0; }
    blockquote { margin: 24px 0; padding: 12px 16px; background: var(--accent-bg); color: var(--accent-text);
                 border-radius: 12px; border: 0; }
    footer { border-top: 1px solid var(--line); padding-top: 16px; padding-bottom: 32px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">Treasured</a>
    <nav><a href="{{ '/privacy/' | relative_url }}">Privacy</a><a href="{{ '/terms/' | relative_url }}">Terms</a></nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer>© 2026 Treasured · Your journal stays on your phone.</footer>
</body>
</html>
